name: weekly-report

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate coverage report
        run: node scripts/coverage_report.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit report
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "沒有變更，略過提交"
            exit 0
          fi
          git config user.name "Oiii-bin"
          git config user.email "329207111+Oiii-bin@users.noreply.github.com"
          git add -A
          git commit -m "weekly coverage report $(date -u +%Y-%m-%d)"
          git push
